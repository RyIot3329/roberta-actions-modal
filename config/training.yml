# Training Configuration
# =====================
# Edit these values and push to trigger training with your desired settings.
# These values are used when the workflow is triggered by a push event.
# For manual runs via GitHub Actions UI, you can override these with workflow_dispatch inputs.

# model: "microsoft/deberta-v3-base"
model: "RyIoT33/deberta-v3-bms-base"

# Epochs is the cosine-anneal horizon AND a ceiling -- early stopping
# (patience 3) halts at the plateau. 30 lets the anneal actually complete:
# the last 60-epoch run stopped at 26, leaving the LR at ~37% of peak.
# LR is sqrt-scaled for the 4x batch increase (2e-5 @ bs32 -> 4e-5).
# A/B A (finish the anneal): 20 epochs with no early stopping so the cosine
# schedule reaches zero; the best validation epoch is still the one kept.
epochs: 20
batch_size: 128
learning_rate: "4e-5"
# 64 leaves room for the optional context string ("<name> | eq ... | unit ...")
max_seq_length: 64
optimizer: "adamw_torch"
scheduler: "cosine"
gradient_accumulation: 1
mixed_precision: "bf16"
weight_decay: "0.01"
warmup_ratio: "0.1"
# Softens the saturated 0.99+ confidences so the auto-accept threshold has
# headroom to separate sure from unsure predictions.
label_smoothing: "0.1"
# Checkpoint selection on validation. f1_weighted tracks the operational
# row-match rate; f1_macro would be dominated by the ~280 singleton classes.
metric_for_best_model: "f1_weighted"
# Reproducibility. `seeds` (comma-separated string) trains every seed in
# parallel; the median-validation seed is the gated candidate and the logit
# ensemble is reported. Single-seed noise on the 830-text test is ~0.5pp.
seed: 42
seeds: "42,43,44"
# Greedy weight soup of the seeds after training; becomes the gated candidate
# only when its validation accuracy beats the median seed.
soup: true
# Fixed initialization seed for the fresh classifier head (pooler + classifier),
# independent of the training seed, so multi-seed runs share a loss basin and
# can be souped. -1 = legacy per-seed random head.
head_init_seed: 1234
push_to_hub: true
hf_repo: "RyIoT33/haystack-autotagging"

# GPU Options: "T4", "L4", "A10", "A100", "A100-40GB", "A100-80GB", "L40S", "H100", "H200", "B200"
# Note: bf16 requires Ampere or newer (A100/L4/A10/H100); the script falls back to fp16 on T4.
# An L4 also handles this workload fine at lower cost if A100 capacity is tight.
gpu: "A100"

# Context-aware training: (name, context) records from data/train_ctx.jsonl join
# the name-only records; context_dropout is the share of context records shown
# name-only per epoch (keeps the deployed name-only API learning), field_dropout
# drops individual context fields so partial context is in-distribution.
context: true
context_dropout: 0.5
field_dropout: 0.2

# Training-recipe knobs (workstream 3). Defaults reproduce the historical
# recipe; each change is adopted only after a 3-seed A/B on validation.
#   early_stopping_patience 0 = train the full cosine horizon (best epoch kept)
#   llrd_decay < 1 = layer-wise LR decay; head_lr_multiplier scales the head
#   rdrop_alpha > 0 = R-Drop consistency (2 forward passes/step)
#   logit_adjustment_tau > 0 = subtract tau*log(class prior) in the train loss
#   ema_decay > 0 = evaluate/checkpoint the EMA of the weights
early_stopping_patience: 0
# A/B B: layer-wise LR decay 0.9 per layer, classifier head at 10x the base LR
llrd_decay: 0.9
head_lr_multiplier: 10.0
rdrop_alpha: 0.0
logit_adjustment_tau: 0.0
ema_decay: 0.0

# Preprocessing knobs, read by scripts/convert_to_jsonl.py (the workflow's
# flat-key lookups ignore this section). Changing them retrains via the
# existing config push trigger with full git provenance.
preprocessing:
  # Include data/synthetic_points.csv (eo66 Display Name variants for thin
  # classes, weight 0.5/row -- real evidence and human templates outrank it).
  use_generated_synthetic: true
  # Train-only augmentation: ~multiplier x organic texts as perturbed variants
  # (equipment-stem prefixes, token dropout, adjacent swaps). 0 disables.
  # Variants colliding with held-out site texts are dropped (decontamination).
  augment_multiplier: 0.5
  augment_seed: 1337
  dropout_p: 0.1
  # Conflict votes: per-site real rows are capped then square-rooted, so a
  # single high-row site cannot outvote a multi-site consensus ('return temp':
  # zoneTemp 1008 rows/1 site vs returnTemp 93 rows/2 sites). 0 = legacy raw
  # row majority. Ties break on site count, then eo66 Display-Name overlap.
  row_cap: 100
